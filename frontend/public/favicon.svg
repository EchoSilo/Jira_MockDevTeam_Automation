<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#0052CC"/>

  <!-- Agent nodes representing team members -->
  <circle cx="16" cy="8" r="3" fill="#FFFFFF"/>
  <circle cx="8" cy="20" r="3" fill="#FFFFFF"/>
  <circle cx="24" cy="20" r="3" fill="#FFFFFF"/>

  <!-- Connection lines between agents -->
  <line x1="16" y1="11" x2="8" y2="17" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
  <line x1="16" y1="11" x2="24" y2="17" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
  <line x1="11" y1="20" x2="21" y2="20" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>

  <!-- Center play/simulate indicator -->
  <polygon points="14,14 14,20 19,17" fill="#36B37E"/>
</svg>
