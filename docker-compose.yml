services:
  jira-simulator:
    build: .
    container_name: jira-simulator
    ports:
      - "8001:8000"
    # Load the full .env so per-agent Jira creds (JIRA_EMAIL_<NAME> /
    # JIRA_API_TOKEN_<NAME>) reach the container. The explicit `environment`
    # entries below still apply (and take precedence) for the core vars.
    env_file:
      - .env
    environment:
      - JIRA_URL=${JIRA_URL}
      - JIRA_EMAIL=${JIRA_EMAIL}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - PROJECT_KEY=${PROJECT_KEY}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    networks:
      - n8n_default
    restart: unless-stopped

networks:
  n8n_default:
    external: true
